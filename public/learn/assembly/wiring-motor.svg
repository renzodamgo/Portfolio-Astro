<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="Motor y dirección"><rect width="1000" height="700" fill="#d7ebf6"/><text x="20" y="676" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="bold" text-anchor="start" fill="#1d2430">12</text><text x="100" y="664" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#1d2430">Motor y dirección</text><rect x="20" y="20" width="300" height="98" fill="#b6d2e4" stroke="#1d2430" stroke-width="2"/>
<text x="34" y="46" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1d2430">Necesitas</text>
<text x="34" y="74" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1d2430">1x</text>
<text x="72" y="74" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2430">motor 310 con su cable</text>
<text x="34" y="100" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1d2430">1x</text>
<text x="72" y="100" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2430">servo con su cable de 3 hilos</text><rect x="380" y="90" width="280" height="420" rx="10" fill="#e8f5ec" stroke="#1d2430" stroke-width="2.5"/>
<text x="520.0" y="116" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">Placa RRC Lite</text>
<text x="520.0" y="137" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">puertos de motor con encoder</text>
<text x="520.0" y="155" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">y de servo PWM</text>
<circle cx="660" cy="150" r="5.5" fill="#f2c94c" stroke="#1d2430" stroke-width="1.5"/><text x="650" y="155" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#1d2430">M1</text>
<circle cx="660" cy="220" r="5.5" fill="#f2c94c" stroke="#1d2430" stroke-width="1.5"/><text x="650" y="225" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#1d2430">M2</text>
<circle cx="660" cy="290" r="5.5" fill="#f2c94c" stroke="#1d2430" stroke-width="1.5"/><text x="650" y="295" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#1d2430">M3</text>
<circle cx="660" cy="360" r="5.5" fill="#f2c94c" stroke="#1d2430" stroke-width="1.5"/><text x="650" y="365" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#1d2430">M4</text>
<circle cx="380" cy="440" r="5.5" fill="#f2c94c" stroke="#1d2430" stroke-width="1.5"/><text x="390" y="445" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1d2430">J4 · canal PWM 1</text>
<path d="M 660 150 L 740 150" fill="none" stroke="#1d2430" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M 660 150 L 740 150" fill="none" stroke="#c0392b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="740" y="100" width="240" height="110" rx="10" fill="#ffffff" stroke="#1d2430" stroke-width="2.5"/>
<text x="860.0" y="126" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">Motor 310</text>
<text x="860.0" y="147" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">reductora 1:90, encoder Hall</text>
<text x="860.0" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">cable de motor y encoder</text>
<path d="M 380 440 L 320 440 L 320 500" fill="none" stroke="#1d2430" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 380 440 L 320 440 L 320 500" fill="none" stroke="#8e44ad" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="30" y="500" width="290" height="90" rx="10" fill="#ffffff" stroke="#1d2430" stroke-width="2.5"/>
<text x="175.0" y="526" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">Servo de dirección</text>
<text x="175.0" y="547" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">al conector J4 de la RRC Lite</text>
<text x="175.0" y="565" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">(canal PWM 1)</text>
<text x="30" y="180" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1d2430">El motor va al puerto M1.</text>
<text x="30" y="200" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">La placa mantiene la velocidad</text>
<text x="30" y="220" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">con el encoder (en rps).</text>
<text x="30" y="252" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1d2430">Puerto en robot.yaml:</text>
<text x="30" y="272" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">rrc_motor_port: 1 y</text>
<text x="30" y="292" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">rrc_motor_sign: -1 (con +rps</text>
<text x="30" y="312" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">el coche va hacia atrás).</text>
<text x="30" y="344" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1d2430">El servo va a J4, que es el</text>
<text x="30" y="364" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">canal 1 (acker_channel: 1).</text>
<text x="30" y="396" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">Sin cables al Pi: todo va por</text>
<text x="30" y="416" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">la RRC Lite (USB, paso 11).</text></svg>