<rect x="760" y="560" width="200" height="80" rx="10" fill="#ffffff" stroke="#1d2430" stroke-width="2.5"/>
<text x="860.0" y="586" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">Motor de 25 mm</text>
<text x="860.0" y="607" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">a BO1 y BO2 del TB6612</text>
<rect x="30" y="470" width="290" height="90" rx="10" fill="#ffffff" stroke="#1d2430" stroke-width="2.5"/>
<text x="175.0" y="496" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">Servo de dirección</text>
<text x="175.0" y="517" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">al puerto de servo PWM</text>
<text x="175.0" y="535" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">de la RRC Lite</text>
<text x="30" y="162" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1d2430">Pin 1 es el cuadrado: impares</text>
<text x="30" y="182" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">por dentro, pares por el borde.</text>
<text x="30" y="214" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1d2430">VCC es la lógica: 3,3 V del Pi</text>
<text x="30" y="234" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">(aguanta 5,5 V como máximo).</text>
<text x="30" y="262" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1d2430">La batería del motor va a VM,</text>
<text x="30" y="282" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">nunca a VCC (paso 13).</text>
<text x="30" y="310" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">STBY va puenteado a VCC en la</text>
<text x="30" y="330" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">placa: siempre activo, sin cable.</text>
<text x="30" y="358" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">3,3 V y GND son dos cables.</text>
<text x="30" y="386" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">Usa el canal B (motor 2). Si las</text>
<text x="30" y="406" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">ruedas giran al revés,</text>
<text x="30" y="426" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">cambia BO1 por BO2.</text></svg>