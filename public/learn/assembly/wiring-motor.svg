<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Motor y dirección"><rect width="1000" height="600" fill="#d7ebf6"/><text x="20" y="576" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="bold" text-anchor="start" fill="#1d2430">12</text><text x="100" y="564" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#1d2430">Motor y dirección</text><rect x="20" y="20" width="300" height="124" fill="#b6d2e4" stroke="#1d2430" stroke-width="2"/>
<text x="34" y="46" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1d2430">Necesitas</text>
<text x="34" y="74" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1d2430">6x</text>
<text x="72" y="74" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2430">cable dupont hembra-hembra</text>
<text x="34" y="100" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1d2430">1x</text>
<text x="72" y="100" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2430">motor con su cable de 2 hilos</text>
<text x="34" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1d2430">1x</text>
<text x="72" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2430">servo con su cable de 3 hilos</text><rect x="360" y="40" width="230" height="300" rx="10" fill="#e8f5ec" stroke="#1d2430" stroke-width="2.5"/>
<text x="475.0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">Raspberry Pi 5</text>
<text x="475.0" y="87" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">pines GPIO</text>
<circle cx="590" cy="120" r="5.5" fill="#f2c94c" stroke="#1d2430" stroke-width="1.5"/><text x="580" y="125" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#1d2430">GPIO12 · pin 32</text>
<circle cx="590" cy="160" r="5.5" fill="#f2c94c" stroke="#1d2430" stroke-width="1.5"/><text x="580" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#1d2430">GPIO5 · pin 29</text>
<circle cx="590" cy="200" r="5.5" fill="#f2c94c" stroke="#1d2430" stroke-width="1.5"/><text x="580" y="205" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#1d2430">GPIO6 · pin 31</text>
<circle cx="590" cy="240" r="5.5" fill="#f2c94c" stroke="#1d2430" stroke-width="1.5"/><text x="580" y="245" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#1d2430">GPIO13 · pin 33</text>
<circle cx="590" cy="280" r="5.5" fill="#f2c94c" stroke="#1d2430" stroke-width="1.5"/><text x="580" y="285" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="end" fill="#1d2430">3,3 V (pin 1) · GND</text>
<rect x="760" y="60" width="220" height="270" rx="10" fill="#e8f5ec" stroke="#1d2430" stroke-width="2.5"/>
<text x="870.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">TB6612FNG</text>
<text x="870.0" y="107" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">puente del motor</text>
<circle cx="760" cy="120" r="5.5" fill="#f2c94c" stroke="#1d2430" stroke-width="1.5"/><text x="770" y="125" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1d2430">PWMA</text>
<circle cx="760" cy="160" r="5.5" fill="#f2c94c" stroke="#1d2430" stroke-width="1.5"/><text x="770" y="165" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1d2430">AIN1</text>
<circle cx="760" cy="200" r="5.5" fill="#f2c94c" stroke="#1d2430" stroke-width="1.5"/><text x="770" y="205" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1d2430">AIN2</text>
<circle cx="760" cy="240" r="5.5" fill="#f2c94c" stroke="#1d2430" stroke-width="1.5"/><text x="770" y="245" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1d2430">STBY</text>
<circle cx="760" cy="280" r="5.5" fill="#f2c94c" stroke="#1d2430" stroke-width="1.5"/><text x="770" y="285" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1d2430">VCC (lógica) · GND</text>
<path d="M 596 120 L 754 120" fill="none" stroke="#1d2430" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 596 120 L 754 120" fill="none" stroke="#e67e22" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 596 160 L 754 160" fill="none" stroke="#1d2430" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 596 160 L 754 160" fill="none" stroke="#f1c40f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 596 200 L 754 200" fill="none" stroke="#1d2430" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 596 200 L 754 200" fill="none" stroke="#3498db" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 596 240 L 754 240" fill="none" stroke="#1d2430" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 596 240 L 754 240" fill="none" stroke="#e74c3c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 596 280 L 754 280" fill="none" stroke="#1d2430" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 596 280 L 754 280" fill="none" stroke="#555555" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="770" y="380" width="200" height="90" rx="10" fill="#ffffff" stroke="#1d2430" stroke-width="2.5"/>
<text x="870.0" y="406" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">Motor de 25 mm</text>
<text x="870.0" y="427" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">a A01 y A02 del TB6612</text>
<path d="M 870 330 L 870 380" fill="none" stroke="#1d2430" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M 870 330 L 870 380" fill="none" stroke="#c0392b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="360" y="380" width="230" height="90" rx="10" fill="#ffffff" stroke="#1d2430" stroke-width="2.5"/>
<text x="475.0" y="406" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">Servo de dirección</text>
<text x="475.0" y="427" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">al puerto de servo PWM</text>
<text x="475.0" y="445" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">de la RRC Lite</text>
<text x="30" y="360" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1d2430">VCC es la lógica: 3,3 V del Pi</text>
<text x="30" y="380" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">(aguanta 5,5 V como máximo).</text>
<text x="30" y="400" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1d2430">La batería del motor va a VM,</text>
<text x="30" y="420" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">nunca a VCC (paso 13).</text>
<text x="30" y="444" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">STBY en alto o el motor no</text>
<text x="30" y="464" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">gira. Si las ruedas giran</text>
<text x="30" y="484" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">hacia atrás, cambia A01 por A02.</text></svg>