<text x="530.0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">Raspberry Pi 5</text>
<text x="530.0" y="87" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">2 controladores: azul 3.0, negro 2.0</text>
<rect x="420" y="150" width="105" height="120" rx="10" fill="#ffffff" stroke="#1d2430" stroke-width="2.5"/>
<rect x="545" y="150" width="105" height="120" rx="10" fill="#ffffff" stroke="#1d2430" stroke-width="2.5"/>
<text x="430" y="262" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1d2430">USB 0</text>
<text x="555" y="262" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1d2430">USB 1</text>
<rect x="440" y="190" width="30" height="26" rx="3" fill="#2f6fd6" stroke="#1d2430" stroke-width="2"/>
<rect x="475" y="190" width="30" height="26" rx="3" fill="#222" stroke="#1d2430" stroke-width="2"/>
<rect x="565" y="190" width="30" height="26" rx="3" fill="#2f6fd6" stroke="#1d2430" stroke-width="2"/>
