<text x="455" y="236" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d2430">azul</text>
<text x="490" y="236" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d2430">negro</text>
<text x="580" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d2430">azul</text>
<text x="615" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d2430">negro</text>
<rect x="760" y="40" width="220" height="80" rx="10" fill="#ffffff" stroke="#1d2430" stroke-width="2.5"/>
<text x="870.0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">Cámara</text>
<text x="870.0" y="87" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">USB 2.0 · /dev/video0</text>
