<text x="30" y="420" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1d2430">Así quedó medido en el coche del equipo: cámara al azul del USB 0, LiDAR al negro del USB 0</text>
<text x="30" y="442" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">y placa al negro del USB 1. Los tres son USB 2.0 o 1.1, así que cualquier puerto sirve, y los</text>
<text x="30" y="464" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">nombres /dev/serial/by-id no dependen del puerto. Enchúfalos con el Pi apagado.</text></svg>