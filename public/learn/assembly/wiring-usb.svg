<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-label="Los sensores, por USB"><rect width="1000" height="580" fill="#d7ebf6"/><text x="20" y="556" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="bold" text-anchor="start" fill="#1d2430">10</text><text x="100" y="544" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#1d2430">Los sensores, por USB</text><rect x="20" y="20" width="300" height="98" fill="#b6d2e4" stroke="#1d2430" stroke-width="2"/>
