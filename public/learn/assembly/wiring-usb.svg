<text x="870.0" y="207" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">con su adaptador USB (CP2102)</text>
<rect x="760" y="290" width="220" height="80" rx="10" fill="#ffffff" stroke="#1d2430" stroke-width="2.5"/>
<text x="870.0" y="316" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">Placa RRC Lite</text>
<text x="870.0" y="337" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">USB · /dev/ttyACM0</text>
<path d="M 760 80 L 700 80 L 700 122 L 455 122 L 455 190" fill="none" stroke="#1d2430" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M 760 80 L 700 80 L 700 122 L 455 122 L 455 190" fill="none" stroke="#9b59b6" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
