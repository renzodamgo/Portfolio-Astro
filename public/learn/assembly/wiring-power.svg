<text x="500.0" y="87" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">7,4 V · 5000 mAh</text>
<text x="500.0" y="105" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">(6 a 8,4 V)</text>
