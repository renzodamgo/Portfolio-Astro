<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="Energía (dos baterías) y luces"><rect width="1000" height="620" fill="#d7ebf6"/><text x="20" y="596" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="bold" text-anchor="start" fill="#1d2430">13</text><text x="100" y="584" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#1d2430">Energía (dos baterías) y luces</text><rect x="20" y="20" width="300" height="124" fill="#b6d2e4" stroke="#1d2430" stroke-width="2"/>
<text x="34" y="46" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1d2430">Necesitas</text>
<text x="34" y="74" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1d2430">2x</text>
<text x="72" y="74" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2430">batería con su conector</text>
<text x="34" y="100" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1d2430">1x</text>
<text x="72" y="100" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2430">cable USB-C a USB-C</text>
<text x="34" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#1d2430">3x</text>
<text x="72" y="126" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1d2430">cable dupont para los LED</text><rect x="380" y="40" width="240" height="110" rx="10" fill="#fdecea" stroke="#1d2430" stroke-width="2.5"/>
<text x="500.0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">Batería del motor</text>
<text x="500.0" y="87" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">solo para el motor</text>
<text x="500.0" y="105" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">VM admite 2,5 a 13,5 V</text>
<rect x="720" y="40" width="250" height="110" rx="10" fill="#e8f5ec" stroke="#1d2430" stroke-width="2.5"/>
<text x="845.0" y="66" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">TB6612FNG</text>
<text x="845.0" y="87" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">bornera VM · GND</text>
<text x="845.0" y="105" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">(potencia del motor)</text>
<rect x="380" y="230" width="240" height="110" rx="10" fill="#fdecea" stroke="#1d2430" stroke-width="2.5"/>
<text x="500.0" y="256" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">Batería del Pi</text>
<text x="500.0" y="277" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">a la RRC Lite</text>
<text x="500.0" y="295" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">(su entrada admite 6 a 14 V)</text>
<rect x="380" y="400" width="240" height="110" rx="10" fill="#ffffff" stroke="#1d2430" stroke-width="2.5"/>
<text x="500.0" y="426" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">Placa RRC Lite</text>
<text x="500.0" y="447" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">entrada de batería</text>
<text x="500.0" y="465" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">salida 5 V / 5 A (USB-C, PD)</text>
<rect x="720" y="400" width="250" height="110" rx="10" fill="#e8f5ec" stroke="#1d2430" stroke-width="2.5"/>
<text x="845.0" y="426" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">Raspberry Pi 5</text>
<text x="845.0" y="447" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">entrada USB-C</text>
<rect x="720" y="230" width="250" height="110" rx="10" fill="#ffffff" stroke="#1d2430" stroke-width="2.5"/>
<text x="845.0" y="256" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#1d2430">Anillo de 16 LED</text>
<text x="845.0" y="277" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">WS2812: 5 V, GND y DIN</text>
<text x="845.0" y="295" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1d2430">DIN al GPIO10 (pin 19)</text>
<path d="M 620 95 L 720 95" fill="none" stroke="#1d2430" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M 620 95 L 720 95" fill="none" stroke="#c0392b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 500 340 L 500 400" fill="none" stroke="#1d2430" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M 500 340 L 500 400" fill="none" stroke="#c0392b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 620 455 L 720 455" fill="none" stroke="#1d2430" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M 620 455 L 720 455" fill="none" stroke="#2c3e50" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 845 400 L 845 340" fill="none" stroke="#1d2430" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M 845 400 L 845 340" fill="none" stroke="#27ae60" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="30" y="380" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1d2430">Dos baterías: una solo para el</text>
<text x="30" y="400" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1d2430">motor (VM del TB6612) y otra</text>
<text x="30" y="420" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">para la RRC Lite, que da 5 V al</text>
<text x="30" y="440" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">Pi por USB-C y mueve el servo.</text>
<text x="30" y="464" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">GND común: el dupont de GND</text>
<text x="30" y="484" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">entre Pi y TB6612 une las dos.</text>
<text x="30" y="508" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">La RRC Lite se apaga bajo 6 V.</text>
<text x="30" y="528" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">LED con brillo bajo.</text></svg>