<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Energía y luces"><rect width="1000" height="600" fill="#d7ebf6"/><text x="20" y="576" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="bold" text-anchor="start" fill="#1d2430">12</text><text x="100" y="564" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#1d2430">Energía y luces</text><rect x="20" y="20" width="300" height="124" fill="#b6d2e4" stroke="#1d2430" stroke-width="2"/>
