<text x="30" y="360" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#1d2430">Batería: a la RRC Lite y a VM</text>
<text x="30" y="380" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">del TB6612. El Pi toma 5 V de</text>
<text x="30" y="400" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">la placa por USB-C. La placa se</text>
<text x="30" y="420" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">apaga bajo 6 V: carga antes de</text>
<text x="30" y="440" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#1d2430">6,8 V. LED con brillo bajo: al</text>
